# shared baseline for recipes in this repo, based on conda-forge-pinning
c_stdlib:
  - if: linux
    then: sysroot
  - if: osx
    then: macosx_deployment_target
  - if: win
    then: vs

c_stdlib_version:
  - if: linux
    then: 2.17
  - if: osx and x86_64
    then: 10.13
  - if: osx and arm64
    then: 11.0

c_compiler:
  - if: win
    then: vs
c_compiler_version:
  # We use GitHub Actions to build packages, see `.github/matrix.json`. Ensure
  # the vs compiler is synced with the one provided in GitHub Actions runner images:
  # https://github.com/actions/runner-images/tree/main#available-images
  - if: win
    then: 2022

cxx_compiler:
  - if: win
    then: vs
cxx_compiler_version:
  - if: win
    then: 2022
